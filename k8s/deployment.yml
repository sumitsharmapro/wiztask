apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiz-app
  labels:
    app: wiz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiz-app
  template:
    metadata:
      labels:
        app: wiz-app
    spec:
      # This uses the Service Account we define in main.tf
      serviceAccountName: wiz-gke-nodes
      containers:
      - name: wiz-app-container
        # Update this to your specific project ID and repo
        image: us-central1-docker.pkg.dev/clgcporg10-170/wiz-app-repo/wiz-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wiz-app-service
spec:
  type: LoadBalancer
  selector:
    app: wiz-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
